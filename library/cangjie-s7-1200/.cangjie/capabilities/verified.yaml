- capability_id: cap.s7120.power-budget-sizing
  revision: 1
  status: active
  slug: power-budget-sizing
  title: 功率预算核算与供电选型
  importance: critical
  importance_rationale: 命中关键任务 T01（选 CPU/模块并算功率预算）；遗漏后果为供电不足致模块不识别或误并联电源损坏设备；吸收 4
    条 verified（含附录B定量算例 p06），证据强、可独立复算。
  one_liner: 先查 CPU 5V/24V 预算，逐项累加模块与 I/O 需求，差额<0 即须加独立外部电源（不得并联、仅共 M）。
  intents:
  - 算 S7-1200 功率预算
  - 判断要不要加外部 24V 电源
  - 选 CPU 能否带动模块清单
  - 算 5V/24V 电流余量
  keywords:
  - 功率预算
  - power budget
  - 5V/24V
  - 外部电源
  - external power supply
  - 电流差额
  - current headroom
  - 传感器电源
  - sensor power
  - SM/CM/SB
  - mA
  also_read:
  - power-wiring-installation
  - device-replacement
  - technology-motion-config
  card: cards/power-budget-sizing.md
  frontmatter:
    description: 计算 S7-1200 CPU 的 5V/24V 功率预算并判定是否需外部电源时激活。场景：有一份 CPU+SM/CM/SB 清单想知道带不带得动、模块不识别怀疑供电不足、24V
      不够想并联电源、在 1211C~1217C 间选型。信号：'算功率预算/can this CPU power these modules'、'24V 不够能并联吗/parallel
      another 24V supply'、'5V/24V 余量/current headroom'。不用于：查订货号针脚（走检索）、完整系统设计、LED/诊断排障。输出两路差额表与最小外部电源容量；硬约束不得并联、M
      共点。
    tags:
    - decision
    - calculation
    - hardware
    - power
