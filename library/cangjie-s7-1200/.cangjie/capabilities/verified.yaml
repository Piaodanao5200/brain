entry:
  name: s7-1200-plc-guide
  description: S7-1200 可编程控制器系统手册的可发现主入口，面向工程实践中的决策、计算、流程与排障。覆盖功率预算与供电选型、用户程序结构决策、数据一致性、通信协议选型与组态、在线诊断排障、存储卡固件与出厂复位维护、V3
    到 V4 设备更换兼容等高频独立意图；纯指令语法、订货号与针脚表不在此入口，走检索参考。
  core_principles:
  - 先决策再操作：功率预算、程序结构、协议角色都要先定方向，避免返工。
  - 安全前置：独立于 PLC 的急停/机电超控不可省，STOP 不等于安全。
  - 先取证后处置：排障先看 LED 与诊断缓冲区，再按事件到 OB 映射定位。
  - 不可逆操作先告知：固件更新、出厂复位、设备更换前确认边界与回退可能。
  - 数据一致性显式化：CPU 只保证单值原子，多值须用 DIS_AIRT/EN_AIRT 等机制。
  out_of_scope:
  - 逐条指令语法与参数表速查（位逻辑/定时/计数/数学等，走手册检索）
  - 订货号、针脚定义、端子排备件套件对照表（走 reference-tables.md 检索）
  - 与三菱/AB 等其他品牌 PLC 的对比与迁移
  - 经认证的功能安全（Failsafe）与网络安全设计
  stop_conditions:
  - 用户要求的操作涉及运行中设备且未确认已做安全隔离时，先停下要求断电与急停确认。
  - 固件跨大版本、V3 到 V4 更换、恢复出厂等不可逆动作，未获用户明确确认前不执行。
  - 问题属于其他品牌或新版固件（V4.4+）特性、本手册 V4.2 未覆盖时，停止并说明范围限制。
router_entry:
  name: s7-1200-handbook-router
  description: S7-1200 系统手册的来源路由入口，按用户问题将其导向对应的能力卡。承载未单独晋级为可发现 Skill 的能力：扫描周期与中断组态、程序下载调试与在线同步、数据类型与寻址规则、安装接线安全规范、HSC/PID/运动控制工艺组态、系统设计七步流程。这些能力不淘汰、经本入口完整可达；同时为所有
    promoted 能力提供近邻负例分流。
promotion_budget: 8
