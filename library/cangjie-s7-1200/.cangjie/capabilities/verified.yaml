  - realtime-scan-interrupt
  - data-consistency
  card: cards/program-structure-decision.md
  frontmatter:
    description: 决定 S7-1200 用户程序该用 OB/FC/FB/DB 哪种块、如何复用与嵌套时激活。场景：从零搭程序纠结逻辑放哪、多台同类设备要复用又不串数据、数据莫名丢失怀疑
      FC/FB 用错、规划调用层级、线性还是模块化。信号：'OB/FC/FB/DB 怎么选/FB vs FC/instance DB'、'多台设备一个功能块/reentrancy'、'数据没保存住/data
