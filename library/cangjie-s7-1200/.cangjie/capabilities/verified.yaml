- capability_id: cap.s7120.program-structure-decision
  revision: 1
  status: active
  slug: program-structure-decision
  title: 用户程序结构决策（OB/FC/FB/DB）
  importance: critical
  importance_rationale: 命中关键任务 T02（设计用户程序结构）；遗漏后果为 FC/FB 误用致跨扫描数据丢失、多设备串扰；吸收 4 条 verified（含可重入与嵌套硬边界），是全书理论内核。
  one_liner: 需跨扫描保存状态且多实例用 FB+背景DB；纯运算用 FC；事件入口用对应 OB；先模块化再线性，并核对 16/6 层嵌套。
  intents:
