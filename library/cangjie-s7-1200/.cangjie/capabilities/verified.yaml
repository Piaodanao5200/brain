- capability_id: cap.s7120.data-consistency
  revision: 1
  status: active
  slug: data-consistency
  title: 数据一致性保障
  importance: high
  importance_rationale: 命中高重要任务 T04（数据一致性访问）；遗漏后果为多值撕裂、HMI 改值被回写覆盖、PIP 静默失效；吸收 5 条
